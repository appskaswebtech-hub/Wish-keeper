# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "820be92bcc75aaf713759e752ad75226"
application_url = "https://wishkeeper.kaswebtechsolutions.com/app"
embedded = true
name = "WishKeeper"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[pos]
embedded = false

[app_proxy]
url = "https://wishkeeper.kaswebtechsolutions.com"
subpath = "wishlist"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_inventory,read_orders,unauthenticated_read_product_listings,write_metaobject_definitions,write_metaobjects,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://wishkeeper.kaswebtechsolutions.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
