# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8ae185b78f5e98b59ab3f3b3d676c733"
application_url = "https://staging-wishkeeper.kaswebtechsolutions.com/app"
embedded = true
name = "Staging-WishKeeper"

[app_proxy]
url = "https://staging-wishkeeper.kaswebtechsolutions.com"
subpath = "wishlist"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_inventory,read_orders,read_themes,unauthenticated_read_product_listings,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://staging-wishkeeper.kaswebtechsolutions.com/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
